[project]
name = "msgbridge"
version = "0.1.0"
description = "Read-only MCP connector for your iMessage and WhatsApp history"
readme = "README.md"
authors = [
    { name = "Jennifer Purwa" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "phonenumbers>=9.0.41",
    "pytypedstream>=0.1.0",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
msgbridge = "msgbridge.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
